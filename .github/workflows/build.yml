name: Test and build AHK Decompiler

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-*.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Lint changed application modules
        run: python -m ruff check core cli.py main.py scripts tests utils/pe_analyzer.py gui/main_window.py gui/layout/sections.py gui/components
      - name: Prepare owned AHK v1/v2 x86/x64 and UPX fixtures
        if: runner.os == 'Windows' && matrix.python == '3.13'
        shell: pwsh
        run: |
          python scripts/prepare_fixtures.py --with-mpress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "AHK_FIXTURES=$env:GITHUB_WORKSPACE\.fixtures" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: python -m pytest -q --basetemp=.pytest-work
      - name: Upload fixture diagnostics
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.os }}-${{ matrix.python }}
          path: |
            .fixtures/fixtures.json
            .pytest-work/**/manifest.json
            .pytest-work/**/events.jsonl

  build:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.lock
      - run: python -m pip install --require-hashes -r requirements-build.lock
      - run: python -m PyInstaller --noconfirm ahk-decompiler.spec
      - name: Verify packaged CLI end to end
        run: python scripts/smoke_packaged.py dist/ahk-decompiler-cli.exe
      - name: Verify packaged Tk startup
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/ahk-decompiler.exe -ArgumentList '--gui-smoke' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Packaged GUI failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ahk-decompiler-windows
          path: dist/*.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name ahk-decompiler-windows --dir dist
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.exe --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
