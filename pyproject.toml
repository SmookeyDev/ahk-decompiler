[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ahk-decompiler"
dynamic = ["version", "dependencies"]
description = "Recover AutoHotkey source from PE resources and process memory"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"

[project.scripts]
ahk-decompiler = "cli:main"

[tool.setuptools]
py-modules = ["main", "cli"]

[tool.setuptools.dynamic]
version = {attr = "core.version.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["core*", "gui*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["windows: native Win32 integration", "ahk: compiled AutoHotkey fixtures"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
